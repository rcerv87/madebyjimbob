services:
  - type: web
    name: madebyjimbob
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: madebyjimbob-db
          property: connectionString
      - key: CF_STREAM_CUSTOMER_CODE
        sync: false
      - key: BANNED_WORDS
        sync: false

databases:
  - name: madebyjimbob-db
    plan: basic-256mb
