# Render Blueprint: one web service (API + WebSockets + built web app) and Postgres.
# Render asks for the `sync: false` values when you create the Blueprint.
services:
  - type: web
    name: madebyjimbob
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: madebyjimbob-db
          property: connectionString
      # Not secret: it appears in every public Stream URL.
      - key: CF_STREAM_CUSTOMER_CODE
        value: xw9exz2muwhw7zsm
      # Comma-separated usernames that can open Studio. Sign up as one of them right after deploy.
      - key: ADMIN_USERNAMES
        sync: false
      - key: BANNED_WORDS
        sync: false
      - key: ALLOW_TEST_TIERS
        value: 'false'
      - key: LOG_LEVEL
        value: info
      # Web Push (phone notifications). The public key is safe to publish; the private key is secret:
      # add it by hand in Render → madebyjimbob → Environment (copy from your local .env).
      - key: VAPID_PUBLIC_KEY
        value: BH1VujLaplskaCgClakGNih8KJnpfZQeCmIPrYHdjRoG3Lz40RPA-ys-l_w6l0alxJOT4BC-rM1agNIyMi6epf0
      - key: VAPID_SUBJECT
        value: https://madebyjimbob.onrender.com
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: madebyjimbob-db
    plan: basic-256mb
