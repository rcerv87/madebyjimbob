# Render Blueprint: one web service (API + WebSockets + built web app) and Postgres.
# Render asks for the `sync: false` values when you create the Blueprint.
services:
  - type: web
    name: madebyjimbob
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: madebyjimbob-db
          property: connectionString
      # Not secret: it appears in every public Stream URL.
      - key: CF_STREAM_CUSTOMER_CODE
        value: xw9exz2muwhw7zsm
      # Comma-separated emails that can open Studio once verified (MBJ-101). Add by hand in Render.
      - key: ADMIN_EMAILS
        sync: false
      # Signs session cookies; Render generates it once. Changing it signs everyone out.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BANNED_WORDS
        sync: false
      - key: LOG_LEVEL
        value: info
      # Web Push (phone notifications). The public key is safe to publish; the private key is secret:
      # add it by hand in Render → madebyjimbob → Environment (copy from your local .env).
      - key: VAPID_PUBLIC_KEY
        value: BH1VujLaplskaCgClakGNih8KJnpfZQeCmIPrYHdjRoG3Lz40RPA-ys-l_w6l0alxJOT4BC-rM1agNIyMi6epf0
      - key: VAPID_SUBJECT
        value: https://madebyjimbob.app
      # The site's address (https://madebyjimbob.app). Set by hand only after the domain is connected in Render →
      # Custom Domains; then pages opened on the onrender.com address move there.
      - key: SITE_URL
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Account email (ADR-012). Set all four by hand in Render → madebyjimbob → Environment.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Optional: makes Studio's channel list instant (MBJ-706); without it the import helper lists the channel.
      - key: YOUTUBE_API_KEY
        sync: false

databases:
  - name: madebyjimbob-db
    plan: basic-256mb
